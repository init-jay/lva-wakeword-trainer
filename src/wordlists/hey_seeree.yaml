  # ORDINARY CONVERSATION - the realistic background rate, and the sanity check that
  # the model is not simply firing on speech. Should read as unremarkable; anything
  # sharing sounds with the wake word belongs in `running` instead. Transfers
  # unchanged to any wake word.
  general:
