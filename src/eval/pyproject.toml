[project]
name = "eval"
version = "0.1.0"
description = "Step 3 on the host, for Apple Silicon - the scoring env the Docker image is"
requires-python = "==3.11.*"

# THE FIFTH HOST ENVIRONMENT, after src/record/, src/preflight/,
# src/train/train-applesilicon/ and src/train/train-mww-applesilicon/, and the one
# that needed least justifying: both
# deployment-runtime wheels (pymicro-wakeword, pyopen-wakeword) publish
# macosx_15_0_universal2, so nothing here is emulated - no TensorFlow, no torch,
# no Metal question (there is no accelerator in inference). It exists because
# scoring is the loop's most-run step and was Docker-only on a Mac, and Docker
# Desktop on Apple Silicon passes nothing useful through for it.
#
# THE PINS ARE A CONTRACT WITH src/eval/Dockerfile. This env exists to answer "is
# this model good" the way the device will read it, and the deployment runtime
# is the two wakeword wheels - so both envs pin the SAME ranges
# (pymicro-wakeword>=2,<3, pyopen-wakeword>=1,<2, numpy>=2,<3). Let one float
# and host and container score the same model with different inference
# pipelines, which is what the harness exists not to measure. If you update
# one pin, update both files in the same edit.
#
# requires-python is the image's base, python:3.11. The wheels are py3-none
# pure Python over a bundled libtensorflowlite_c, so the interpreter minor
# cannot change the inference pipeline - but pinning the same one costs
# nothing and removes one uncontrolled variable between a host number and a
# container number.
#
# WHY THE .venv LIVES HERE rather than in a sibling directory: unlike the
# trainers (whose source tree is mounted into an image that would sweep a
# multi-GB .venv along), src/eval/ is a self-contained compose project whose
# image bakes in nothing - the sources are mounted, not copied. The price is
# that this .venv sits inside that build context, which is why .dockerignore
# beside this file keeps it out of every `docker compose build` upload.

dependencies = [
    # The deployment runtime, at exactly the Dockerfile's ranges (comment above).
    "pymicro-wakeword>=2,<3",
    "pyopen-wakeword>=1,<2",
    "numpy>=2,<3",
    "scipy",
    # PyYAML is not for evaluation. `mww/manifest.py` imports mww/config.py to
    # read WINDOW_STEP_MS, and that module parses YAML - same reason the image
    # carries it.
    "pyyaml",

    # The openWakeWord .onnx path, which is NOT the deployment runtime (see
    # backends.py, which labels it in every report). onnxruntime is the CPU
    # package - the one that publishes a macOS wheel (the oww trainer's note).
    # tqdm, requests and scikit-learn are openwakeword's undeclared imports on
    # exactly this path: PyPI metadata does not determine what the code
    # imports, which is why the Dockerfile installs them explicitly too.
    "onnxruntime",
    "tqdm",
    "requests",
    "scikit-learn",
]

# openwakeword is DELIBERATELY NOT a dependency here. Its setup.py pins
# torchaudio>=0.13.1,<1, and a full resolve of that would drag torch into a
# scoring env for a module (openwakeword.model) that uses no torch at all.
# src/scripts/setup-eval-host.sh installs the shared openwakeword/ clone
# `uv pip install --no-deps -e` instead - the same move both trainer envs
# make, for the same pin. All eight of that script's patches touch only
# train.py (it passes it as each patch's sole target), so the inference path
# this env runs is upstream model.py.

[tool.uv]
package = false
