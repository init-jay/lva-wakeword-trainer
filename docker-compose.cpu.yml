# CPU overlay - point both trainers at their CPU images. Any architecture.
#
#     export COMPOSE_FILE=docker-compose.yml:docker-compose.cpu.yml
#     docker compose build oww-trainer mww-trainer
#
# THIS IS THE APPLE SILICON PATH, and it is an overlay rather than a separate
# service so that everything else - the wordlists mount, the corpus/output split,
# the scripts in scripts/ - stays exactly as it is. Only the base image changes.
#
# It is not Apple-specific though, and the name says so. A Linux box with no NVIDIA
# card uses the same overlay, as does an AMD one: the CPU images are the fallback
# for "no CUDA", not for "is a Mac".
#
# WHY THERE IS NO METAL EQUIVALENT OF THIS FILE. Docker Desktop does not pass the
# Metal device through, so a torch build that asks for `mps` inside a container
# finds nothing and falls back to CPU without saying so. Reaching Metal means
# leaving Docker entirely - a host environment like record/ and preflight/ have.
# docker-compose.mps.yml is the signpost for that question and stays empty; it says why.
#
# WHAT TO EXPECT. Unmeasured on Apple Silicon at the time of writing - that
# measurement is the point of these images. The CUDA figures to compare against, on
# an RTX 3090 / 20 GB / 4 cores, are oww 28m59s and mww 28m02s end to end (SPEED.md).
# Before concluding a slow run means "CPU is hopeless": the two things
# CUDA actually bought were multi-threaded feature computation and not swapping,
# and the second one is a memory setting on a Mac, not a hardware limit.
#
# GIVE DOCKER ENOUGH MEMORY FIRST. openWakeWord's negative feature array is 17.28 GB
# and is mmap'd, not streamed. Docker Desktop's default VM allocation is well under
# that, and exceeding it does not error - it page-faults, which looks like a slow
# CPU rather than a misconfiguration. Settings > Resources > Memory.

services:
  oww-trainer:
    build:
      dockerfile: docker/Dockerfile.oww.cpu

  mww-trainer:
    build:
      dockerfile: docker/Dockerfile.mww.cpu

  # PIPER MUST BE OVERRIDDEN TOO, and forgetting it is worse than forgetting a
  # trainer. docker/Dockerfile.piper builds on nvidia/cuda:12.4.1-cudnn-runtime,
  # which is linux/amd64 only - so on Apple Silicon it does not fail, it runs the
  # ENTIRE microWakeWord corpus stage under qemu emulation. A baseline measured that
  # way times the emulator.
  #
  # NEITHER TTS SERVICE NEEDS AN OVERRIDE, and both used to look like they might.
  #
  # Piper is multi-arch because docker/Dockerfile.piper no longer builds on a CUDA
  # base at all - `--use-cuda` measured 2.5x SLOWER, so the flag it existed to enable
  # was one nobody should use. It now sits on rhasspy/wyoming-piper, linux/amd64 and
  # linux/arm64. Before that change this overlay was incomplete in the worst way: the
  # trainers ran native while Piper generated the entire microWakeWord corpus under
  # qemu, which succeeds silently and makes the timing meaningless.
  #
  # Kokoro is multi-arch already: ghcr.io/remsky/kokoro-fastapi-cpu:v0.8.1 publishes
  # linux/arm64 alongside amd64, verified with `docker manifest inspect`.
