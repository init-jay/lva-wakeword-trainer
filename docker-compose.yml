x-kokoro: &kokoro
  build:
    context: .
    dockerfile: docker/Dockerfile.kokoro
    args:
      KOKORO_IMAGE: ${KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu:v0.8.1}

x-piper: &piper
  build:
    context: .
    dockerfile: docker/Dockerfile.piper
  volumes:
    # Voices are downloaded on demand and get large - libritts_r alone carries 904
    # speakers - so they persist here rather than in the container.
    - ./data/piper_voices:/data
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  kokoro:
    <<: *kokoro
    ports:
      - "8880:8880"

  kokoro2:
    <<: *kokoro
    ports:
      - "8881:8880"

  # Deliberately a single instance - see the measurement above.
  #
  # `--voice` is REQUIRED by wyoming-piper even though it downloads voices on
  # demand: without it the process exits 2 with "--voice is required for the piper
  # backend" before binding the port, and the only symptom further up the stack is
  # that the service name stops resolving. It is only the DEFAULT for requests that
  # do not name a voice - corpus/piper.py always names one, so this does not
  # constrain which voices the corpus can use.
  piper:
    <<: *piper
    ports:
      - "10200:10200"
    command: ["--uri", "tcp://0.0.0.0:10200", "--data-dir", "/data",
              "--download-dir", "/data", "--voice", "en_US-lessac-medium"]

  # Evaluation harness - step 3. CPU only, no GPU reservation, and the one
  # service here meant to run ON THE MAC rather than on the training server - it
  # builds native for linux/arm64. It carries both inference stacks and neither
  # trainer, because scoring a model and training one have incompatible pins.
  #
  #   docker compose build eval
  #   docker compose run --rm eval python -m eval.backends --model M
  #   docker compose run --rm eval python -m eval.compare_models --models A B --sweep
  #
  eval:
    build:
      context: .
      dockerfile: docker/Dockerfile.eval
    volumes:
      - ./eval:/app/eval:ro
      # train/ for `python -m train.mww.manifest`, which cuts the ESPHome manifest
      # from a measured cutoff - an evaluation decision, so it belongs in this image.
      - ./train:/app/train:ro
      # The per-wake-word phrase lists the eval corpus is generated from. Read-only:
      # generate_negatives.py renders them, it does not edit them - they are written
      # by hand or by the `write-wordlists` skill, and a corpus that silently stopped
      # matching its wordlist would be untraceable.
      - ./wordlists:/app/wordlists:ro
      - ./output:/app/output
      - ./data/recordings/holdout:/app/data/recordings/holdout:ro
      # Training positives, for the rare deliberate check against them. Scoring here
      # reports TRAINING accuracy, and eval/paths.py warns when a run is pointed here.
      - ./data/recordings/samples:/app/data/recordings/samples:ro
      - ./data/corpus/eval:/app/data/corpus/eval

  # microWakeWord trainer, for the ESP32 target - step 2. A SEPARATE image
  # from `oww-trainer` because mWW requires numpy>=2 and this repo pins numpy<2 for
  # openWakeWord and torch - they cannot share an environment. See Dockerfile.mww.
  #
  # No depends_on: the corpus is built by the openWakeWord side or by corpus/ directly,
  # and this service only reads directories. Start it explicitly.
  mww-trainer:
    build:
      context: .
      dockerfile: docker/Dockerfile.mww
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # ONE MOUNT COVERS THE INPUTS, and data/ separates them by how replaceable
      # they are:
      #   data/external/   third-party downloads - huge, fixed, re-fetchable
      #   data/recordings/ the real clips - irreplaceable
      #   data/corpus/     generated per run, one directory per trainer:
      #                    .../oww/ from train.py, .../mww/ from mww/corpus.py
      # Neither trainer reaches into the other's corpus, which matters because
      # train.py rmtree's its own at the start of every run.
      - ./data:/app/data
      # Trained models and their manifests. A SEPARATE TREE from the corpus, so the
      # rmtree above cannot reach a model even in principle.
      - ./output:/app/output
      - ./wordlists:/app/wordlists:ro       # the phrases, per wake word
      # SOURCE IS MOUNTED, NOT BAKED IN. The images COPY train/ so their build-time
      # import check has something to check, and these mounts shadow that copy at
      # runtime - so editing a trainer or a script does not mean rebuilding a CUDA
      # image. Read-only: the trainers read their source, they never write it.
      - ./train:/app/train:ro
      - ./scripts:/app/scripts:ro
    shm_size: "8gb"

  oww-trainer:
    build:
      context: .
      dockerfile: docker/Dockerfile.oww
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Same split as the mww service above: data/ is inputs and generated corpus,
      # output/ is models. train.py rmtree's data/corpus/<wake_word>/oww/ every run.
      - ./data:/app/data
      - ./output:/app/output
      - ./wordlists:/app/wordlists:ro
      # SOURCE IS MOUNTED, NOT BAKED IN. The images COPY train/ so their build-time
      # import check has something to check, and these mounts shadow that copy at
      # runtime - so editing a trainer or a script does not mean rebuilding a CUDA
      # image. Read-only: the trainers read their source, they never write it.
      - ./train:/app/train:ro
      - ./scripts:/app/scripts:ro
    environment:
      # Both instances; each is a separate single-threaded process.
      - KOKORO_URL=http://kokoro:8880,http://kokoro2:8880
    # Deliberately NOT depends_on piper. Nothing in train.py talks to it yet, and
    # listing it would start two more GPU services for every `compose run oww-trainer`
    # - including the conversion and eval one-offs - holding VRAM the training run
    # wants. Start it explicitly: `docker compose up -d piper`.
    depends_on:
      - kokoro
      - kokoro2
    shm_size: "8gb"
