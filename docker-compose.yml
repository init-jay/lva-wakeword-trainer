x-kokoro: &kokoro
  build:
    context: .
    dockerfile: docker/Dockerfile.kokoro
    args:
      KOKORO_IMAGE: ${KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu:v0.8.1}

x-piper: &piper
  build:
    context: .
    dockerfile: docker/Dockerfile.piper
  volumes:
    # Voices are downloaded on demand and get large - libritts_r alone carries 904
    # speakers - so they persist here rather than in the container.
    - ./data/piper_voices:/data

services:
  kokoro:
    <<: *kokoro
    ports:
      - "8880:8880"   # the raw OpenAI-compatible API - the audit tool, manual checks
      - "8899:8899"   # the TTS protocol - what the trainers and eval speak

  kokoro2:
    <<: *kokoro
    ports:
      - "8881:8880"
      # Same wrapper, second process. The published protocol port must dodge
      # both 8899 (kokoro's) and 8900 - the Mac's in-process mlx engine's
      # default (tts-service/engines/kokoro_mlx), which is THE Kokoro on a
      # Mac and takes precedence: a Mac that runs compose at all does not
      # run docker kokoro, and publishing 8900 only collided with it
      # (2026-09-17 review). 8901 is unused elsewhere in this repo.
      - "8901:8899"

  piper:
    <<: *piper
    ports:
      - "8898:8898"   # the TTS protocol - the image's default command serves it

  # The eval step has moved out of this file into src/eval/docker-compose.yml - its
  # own project, because the base file is the training one and an eval-only
  # machine should not be building trainer images.

  # microWakeWord trainer, for the ESP32 target - step 2. A SEPARATE image
  # from `oww-trainer` because mWW requires numpy>=2 and this repo pins numpy<2 for
  # openWakeWord and torch - they cannot share an environment. See Dockerfile.mww.cuda.

  mww-trainer:
    build:
      context: .
      dockerfile: docker/Dockerfile.mww.cuda
    volumes:
      # ONE MOUNT COVERS THE INPUTS, and data/ separates them by how replaceable
      # they are:
      #   data/external/   third-party downloads - huge, fixed, re-fetchable
      #   data/recordings/ the real clips - irreplaceable
      #   data/corpus/     generated per run, one directory per trainer:
      #                    .../oww/ from train.py, .../mww/ from mww/corpus.py
      # Neither trainer reaches into the other's corpus, which matters because
      # train.py rmtree's its own at the start of every run.
      - ./data:/app/data
      # Trained models and their manifests. A SEPARATE TREE from the corpus, so the
      # rmtree above cannot reach a model even in principle.
      - ./output:/app/output
      - ./src/wordlists:/app/src/wordlists:ro       # the phrases, per wake word
      # SOURCE IS MOUNTED, NOT BAKED IN. The images COPY src/train/ and src/tts-service/ so
      # their build-time import check has something to check, and these mounts shadow
      # that copy at runtime - so editing a trainer or a script does not mean
      # rebuilding a CUDA image. Read-only: the trainers read their source, they
      # never write it.
      - ./src/train:/app/src/train:ro
      # The TTS protocol client (src/train/corpus's sys.path bootstrap finds it at
      # /app/src/tts-service/tts_protocol). The trainers carry no engine code - the
      # engines are the `kokoro` and `piper` services. src/tts-service/README.md.
      - ./src/tts-service:/app/src/tts-service:ro
      - ./src/scripts:/app/src/scripts:ro
    environment:
      # /app/src is the import root: the repo modules (train, wordlists, eval) import by
      # their pre-reorg names, and they are mounted there, not installed.
      - PYTHONPATH=/app/src
      # Named explicitly: inside this container the trainers' loopback defaults
      # point at nothing. The box's run-mww-training.sh passes --kokoro-fraction 0
      # (all-Piper, matching the services it starts - only piper), but the module
      # default is a 30% Kokoro mix, and if anyone raises it these names are what
      # make `docker compose up -d kokoro` all that is needed to back it.
      - PIPER_URL=tcp://piper:8898
      - KOKORO_URL=tcp://kokoro:8899,tcp://kokoro2:8899
    shm_size: "8gb"

  oww-trainer:
    build:
      context: .
      dockerfile: docker/Dockerfile.oww.cuda
    volumes:
      # Same split as the mww service above: data/ is inputs and generated corpus,
      # output/ is models. train.py rmtree's data/corpus/<wake_word>/oww/ every run.
      - ./data:/app/data
      - ./output:/app/output
      - ./src/wordlists:/app/src/wordlists:ro
      # SOURCE IS MOUNTED, NOT BAKED IN. The images COPY src/train/ and src/tts-service/ so
      # their build-time import check has something to check, and these mounts shadow
      # that copy at runtime - so editing a trainer or a script does not mean
      # rebuilding a CUDA image. Read-only: the trainers read their source, they
      # never write it.
      - ./src/train:/app/src/train:ro
      # The TTS protocol client - same mount as mww-trainer above.
      - ./src/tts-service:/app/src/tts-service:ro
      - ./src/scripts:/app/src/scripts:ro
    environment:
      # Import root, same as the mww service above.
      - PYTHONPATH=/app/src
      # Both instances; each is a separate single-threaded process. The
      # protocol port, not the raw API port: the trainer no longer speaks
      # OpenAI-compatible HTTP.
      - KOKORO_URL=tcp://kokoro:8899,tcp://kokoro2:8899
      # The Piper engine service. train.py's own default (127.0.0.1) would be
      # the CONTAINER's loopback inside here, so it must be named explicitly.
      - PIPER_URL=tcp://piper:8898
    # Deliberately NOT depends_on piper. train.py only needs it when
    # --piper-fraction > 0, and listing it would start the service for every
    # `compose run oww-trainer` - including the conversion and eval one-offs.
    # Start it explicitly: `docker compose up -d piper`.
    depends_on:
      - kokoro
      - kokoro2
    shm_size: "8gb"
