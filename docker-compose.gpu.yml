# GPU overlay for the TTS servers. Apply it on the training server:
#
#     docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d kokoro kokoro2
#
# Or set it once for the shell, so plain `docker compose` picks both up:
#
#     export COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml
#
# WHY AN OVERLAY AND NOT A FLAG. A `deploy.resources.reservations.devices` block
# cannot be made conditional inside one compose file - there is no falsy value that
# means "no device", and a compose file asking for an nvidia device FAILS TO START on
# a machine that has none. That is what kept `kokoro` from running on the Mac, which
# is the machine the evaluation corpus most needs to be generatable on. Compose merges
# `deploy` additively across -f files, so the reservation belongs in the file that is
# only ever applied where a GPU exists.
#
# ONLY THE TTS SERVERS ARE HERE. `trainer` and `mww` keep their reservations in
# docker-compose.yml because they cannot run without a GPU at all - making those
# conditional would turn a clear startup failure into a silent fallback onto a CPU
# that will not finish. Kokoro is the one service that is genuinely useful both ways.
services:
  kokoro:
    build:
      args:
        KOKORO_IMAGE: ghcr.io/remsky/kokoro-fastapi-gpu:v0.8.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  kokoro2:
    build:
      args:
        KOKORO_IMAGE: ghcr.io/remsky/kokoro-fastapi-gpu:v0.8.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
