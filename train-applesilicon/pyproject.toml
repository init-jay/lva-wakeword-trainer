[project]
name = "train-applesilicon"
version = "0.1.0"
description = "Step 2 on the host, for Apple Silicon - the trainer the CUDA images cannot be"
requires-python = ">=3.11,<3.13"

# THE THIRD HOST ENVIRONMENT, after record/ and preflight/, and for a different
# reason than either of those. They run on the host because they need a MICROPHONE.
# This one runs on the host because Docker Desktop does not pass the Metal device
# through, so a containerised "MPS" build silently gets CPU. See apple-port.md.
#
# WHY IT IS NOT AT train/host/. `COPY train/ ./train/` in both trainer Dockerfiles
# would sweep a .venv into the images, and a macOS torch install is several GB. The
# .dockerignore keeps it out of the build context too, so the mistake needs two
# errors rather than one.
#
# WHAT RUNS WHERE ON A MAC, once this exists:
#
#   corpus generation   Docker, unchanged - kokoro-fastapi-cpu and Piper are both
#                       CPU-only by choice and already run on arm64
#   training            HERE
#   eval                Docker, unchanged - Dockerfile.eval builds native arm64
#
# So this environment covers the one stage that could not move, not the pipeline.

dependencies = [
    # Core, matching docker/requirements.txt. numpy<2 is openWakeWord's constraint,
    # not a macOS one - speechbrain 0.5.14 and datasets 2.14.6 predate the numpy 2 ABI.
    # scipy IS BOUNDED BECAUSE acoustics IS PINNED, exactly as in
    # docker/requirements.txt: acoustics 0.2.6 imports scipy.special.sph_harm, which
    # scipy removed in 1.17, and openwakeword/data.py fails at import without it.
    "scipy<1.17",
    "numpy<2",
    "pyarrow>=8.0.0,<15.0.0",
    "tqdm",
    "pyyaml",
    "requests",

    # PLAIN torch from PyPI, NOT the cu121 index the Dockerfile uses. The macOS arm64
    # wheels carry the MPS backend already; there is no separate "torch-metal" to
    # install and no index-url to set.
    #
    # PINNED TO 2.5.1 TO MATCH docker/Dockerfile.oww.cpu AND THE CUDA IMAGE. That is
    # the entire point of this environment: it exists to answer whether the macOS
    # wheel is faster than the linux/arm64 one at the SAME version. Let these float
    # and the answer is contaminated by whatever else changed between releases - and
    # the newer wheels are actively broken here anyway (torchaudio dropped
    # set_audio_backend and routed load() through torchcodec after 2.5, which cost
    # two failed runs before the pin).
    "torch==2.5.1",
    "torchaudio==2.5.1",

    # openWakeWord's training pipeline, pinned exactly as the image pins them.
    "mutagen==1.47.0",
    "torchinfo==1.8.0",
    "torchmetrics==1.2.0",
    "speechbrain==0.5.14",
    "audiomentations==0.33.0",
    "torch-audiomentations==0.11.0",
    "acoustics==0.2.6",
    "pronouncing==0.2.0",
    # setuptools IS A REAL RUNTIME DEPENDENCY HERE, not build tooling. pronouncing
    # 0.2.0 does `from pkg_resources import resource_stream` at import, pkg_resources
    # ships inside setuptools, and Python 3.12 no longer bundles either. The trainer
    # images get it for free because their pip base image installs it; a uv venv is
    # clean and does not, so openwakeword/data.py fails on `import pronouncing`.
    #
    # BOUNDED BECAUSE pkg_resources IS ALREADY GONE. setuptools removed it after 80;
    # an unbounded pin installed 84.0.0 here and `import pronouncing` still failed,
    # with setuptools present. The trainer images are unaffected only because their
    # base image predates the removal - which is the same "works because it was built
    # earlier" trap as scipy/acoustics in docker/requirements.txt.
    #
    # This is a stay of execution, not a fix. pronouncing 0.2.0 is from 2016 and
    # unmaintained; when a bound below 81 becomes untenable it needs replacing or
    # vendoring - it is used only for the adversarial phoneme lists.
    "setuptools<81",
    # datasets IS DELIBERATELY ABSENT, unlike docker/requirements.txt which pins
    # 2.14.6. Nothing on the host training path imports it: openWakeWord's train.py
    # does not (its only mention of the word is a comment in custom_verifier_model.py,
    # which this pipeline never runs), and the one thing that does - resampling MIT
    # RIRs, AudioSet and FMA in download-external-data.sh - runs INSIDE the trainer
    # container, per that script's own usage lines.
    #
    # It was copied here with the rest of the image's requirements and then blocked
    # the mlx extra: datasets 2.14.6 caps huggingface-hub below 1.0 and kokoro-mlx
    # needs >=1.0. Removing an unused pin is the honest fix; an override would have
    # left datasets installed and quietly wrong.
    "deep-phonemizer==0.0.19",

    # Feature computation. The CPU package, NOT onnxruntime-gpu - which publishes no
    # macOS wheel at all. This is the one that carries CoreMLExecutionProvider, so
    # the phase 2 change is a provider name in patches/feature-device-selection.py
    # rather than a different package.
    "onnxruntime>=1.19,<2",

    # ONNX -> tflite conversion, so a host run produces the same two artefacts a
    # CUDA run does. tensorflow 2.21.0 publishes macosx_12_0_arm64 wheels, so this
    # is native and needs no Rosetta.
    #
    # tensorflow-metal IS DELIBERATELY ABSENT and is not an oversight: its newest
    # release (1.2.0, 2025-01-31) predates TensorFlow 2.21.0 (2026-03-06) by five
    # minor versions, and it declares no TensorFlow dependency to check against.
    # Conversion is CPU work anyway. apple-port.md has the full finding.
    #
    # onnx, sng4onnx and psutil are onnx2tf's undeclared imports. They are listed
    # for the same reason docker/requirements.txt lists them: removing them on the
    # strength of onnx2tf's metadata broke the build with ModuleNotFoundError.
    "tensorflow==2.21.0",
    "onnx2tf",
    "onnx",
    "onnx-graphsurgeon",
    "sng4onnx",
    "tf_keras",
    "psutil",
    "ai-edge-litert",
]

[project.optional-dependencies]
# Kokoro TTS in-process, instead of over HTTP to the container or a host server.
# ~1.7x on the corpus stage at single-clip, ~2.9x batched - see
# train/corpus/kokoro_mlx.py for the measurements and the two caveats (28 English
# voices against the service's 42, and unverified pronunciation).
#
# THE FORK, NOT UPSTREAM. Upstream computes the per-phoneme durations that word
# timestamps are derived from and then discards them; the fork returns them. Without
# timestamps there is no exact run-on cut point, and the estimate-based fallback
# measured +153 ms late - the error that left microWakeWord with no run-on positives
# at all. Nothing else differs between the two.
#
# OPTIONAL because it is Apple Silicon only and the trainer images must not need it:
# train/corpus/kokoro_mlx.py imports it lazily and reports why it is unusable rather
# than failing at import.
#
#     uv sync --extra mlx
mlx = [
    "kokoro-mlx",
]

[tool.uv.sources]
# Pinned to the fork's main. uv records the resolved commit in uv.lock, so a run is
# reproducible even though this points at a branch.
kokoro-mlx = { git = "https://github.com/init-jay/kokoro-mlx", branch = "main" }

[tool.uv]
package = false
