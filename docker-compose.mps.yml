# PERMANENTLY EMPTY - Apple Silicon (Metal / MPS) overlay. Not "not yet": not possible.
#
# YOU ALMOST CERTAINLY WANT docker-compose.cpu.yml INSTEAD. That overlay swaps both
# trainers for multi-arch CPU images that build and run native on Apple Silicon, and
# it is the supported way to train on a Mac:
#
#     export COMPOSE_FILE=docker-compose.yml:docker-compose.cpu.yml
#
# WHY THIS FILE CANNOT BE FILLED IN. Docker Desktop does not pass the Metal device
# through to containers. A torch build that asks for `mps` inside a container finds
# no device and falls back to CPU - silently, which is worse than failing, because
# the run completes and looks accelerated. There is no device reservation to write
# here the way docker-compose.cuda.yml writes `driver: nvidia`; the Compose spec has
# nothing to say and neither does the runtime.
#
# So the choice on a Mac is not "CPU image or Metal image". It is:
#
#   in Docker      CPU, via docker-compose.cpu.yml      <- exists, use this
#   outside Docker Metal, or just a faster CPU torch    <- train-applesilicon/
#
# train-applesilicon/ carries a resolved pyproject.toml and uv.lock for that second
# route. It is not wired to anything yet, but it is no longer only about Metal: the
# macOS wheels link Accelerate, which measured 6.3x the container's torch on a
# GEMM-shaped train step with no GPU involved at all. apple-port.md phase 1b has the
# numbers, and phase 2 the Metal question - including that tensorflow-metal cannot
# pair with TensorFlow 2.21.0, so microWakeWord has no Metal story either way.
#
# Kept as a file rather than deleted so that the question "is there an Apple Silicon
# GPU path?" is answerable from `ls`, and answered "no, and here is where to go
# instead" rather than by silence. If that ever stops being true, this file becomes
# an overlay; until then it is a signpost.
services: {}
