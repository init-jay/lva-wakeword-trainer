[project]
name = "tts-service"
version = "0.1.0"
description = "The shared TTS layer of the wakeword trainer: engine registry, TCP service, batched corpus generation."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "requests",
    "tqdm",
]

# The in-process MLX backend is Apple Silicon only and has no wheels elsewhere,
# so it is an extra rather than a dependency: the server takes it with
# `uv run --extra mlx python -m tts_service.server --engine kokoro-mlx`.
[project.optional-dependencies]
mlx = ["kokoro-mlx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tts_service"]
